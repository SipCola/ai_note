[project]
name = "media-ops-backend"
version = "0.1.0"
description = "Minimal LangGraph content workflow framework"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "langgraph>=1.0,<1.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
